[pytest]
# Configuração simplificada do pytest

# Diretórios de teste
testpaths = tests

# Padrões de arquivos
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Opções de output
addopts = 
    -v
    --tb=short
    --color=yes
    -p no:warnings

# Diretórios a ignorar (CRÍTICO para Windows)
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .venv
    venv
    airflow/logs
    airflow/logs/scheduler
    logs
    node_modules

# Markers
markers =
    slow: marca testes lentos
    integration: marca testes de integração
    unit: marca testes unitários